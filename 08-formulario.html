<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario em html 5</title>
</head>
<body>
    <h1>formulario em html 5</h1>
    <h3>cadastro de novo usuario</h3>
<form action="/submit" method="post">
    <label for="nome">Nome Completo:</label><br>
    <input type="text" id="nome" name="nome" placeholder="Digite seu e-mail" required><br><br>


    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

    <label for="Data-nascimento">Data de nascimento:</label><br>
    <input type="date" id="Data-nascimento" required><br><br>

    <select name="genero" id="genero">
        <option value="">Selecione</option>
        <option value="masculino">masculino</option>
        <option value="feminino">Feminino</option>
        <option value="outro">Outro</option>
    </select><br><br>

    <input type="submit" value="Cadastrar">
</form>
</body>
</html>
